<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Family Tree | Bloodline Archive</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero-panel">
        <div>
          <p class="eyebrow">BLOODLINE ARCHIVE / 01</p>
          <h1>Our family, connected.</h1>
          <p class="hero-copy">
            Explore generations of memory, names, and lineage in one living map.
          </p>
        </div>
        <nav class="hero-nav" aria-label="Primary navigation">
          <a href="./about.html">About</a>
          <a href="./image.html">Image archive</a>
        </nav>
      </header>
      <section class="control-bar" aria-label="Tree controls">
        <div class="control-intro">
          <span class="status-dot"></span><span id="tree-status">Interactive lineage map</span>
        </div>
        <div class="controls">
          <label for="language">Language</label>
          <select id="language" aria-label="Choose tree language">
            <option value="bn">বাংলা</option>
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select>
          <button type="button" onclick="expandAll()">Expand all</button>
          <button type="button" onclick="collapseAll()">Collapse all</button>
        </div>
      </section>
      <section class="tree-section" aria-label="Family tree">
        <div class="tree-heading">
          <div>
            <p class="eyebrow">THE GENERATIONS</p>
            <h2>Trace the line</h2>
          </div>
        </div>
        <div id="tree" role="img" aria-label="Family tree visualization"></div>
      </section>
    </main>
    <script src="js/d3.v3.min.js"></script>
    <script src="js/theTree.js"></script>

    <footer class="site-footer">
      2026 / <a href="https://hrahman1777.github.io/" target="_blank">HRahman1777</a
      ><span>Family tree archive</span>
    </footer>
  </body>
</html>
